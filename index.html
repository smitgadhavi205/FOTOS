<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1428" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <title>Mypic — AI Photo Finder for Weddings, Birthdays & Events</title>
    <meta name="description" content="Mypic is the luxury, privacy-first AI photo gallery. Upload a selfie and instantly find every photo you appear in from weddings, birthdays, and celebrations." />
    <meta name="keywords" content="AI photo finder, wedding photo gallery, event photos, face recognition photos, birthday photo sharing, selfie photo search, private photo gallery, photographer gallery" />
    <meta name="author" content="Mypic" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://imagecon.lovable.app/" />

    <meta property="og:site_name" content="Mypic" />
    <meta property="og:title" content="Mypic — AI Photo Finder for Weddings & Events" />
    <meta property="og:description" content="Upload a selfie and instantly find every photo you appear in. Privacy-first AI photo galleries for weddings, birthdays & luxury events." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://imagecon.lovable.app/" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mypic — AI Photo Finder for Weddings & Events" />
    <meta name="twitter:description" content="Upload a selfie and instantly find every photo you appear in — privacy-first AI galleries." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mypic",
      "url": "https://imagecon.lovable.app/",
      "description": "Privacy-first AI photo gallery that instantly finds every event photo you appear in.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mypic",
      "url": "https://imagecon.lovable.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://imagecon.lovable.app/find-photos?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Mypic",
      "applicationCategory": "PhotographyApplication",
      "operatingSystem": "Web",
      "description": "AI-powered face-matching photo gallery for weddings, birthdays and luxury events.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
